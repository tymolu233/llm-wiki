name: Publish to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. beta, next, latest)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npmjs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "$VERSION" =~ -(alpha|beta|rc|next) ]]; then
              TAG="beta"
            fi
          fi

          if [ -n "$TAG" ]; then
            echo "Publishing $VERSION with --tag $TAG"
            npm publish --access public --tag "$TAG"
          else
            echo "Publishing $VERSION"
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
